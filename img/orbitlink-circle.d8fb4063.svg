<svg width="120" height="120" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbitlink_orange_circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF4F00"/>
    </linearGradient>
  </defs>

  <!-- 主轨道 -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="url(#orbitlink_orange_circle)" stroke-width="3"/>
  <ellipse cx="40" cy="40" rx="26" ry="14"
           fill="none"
           stroke="#FF7A1A"
           stroke-width="2"
           transform="rotate(-25 40 40)"/>

  <!-- 轨道节点 -->
  <circle cx="64" cy="32" r="4" fill="#FFFFFF" stroke="#FF4F00" stroke-width="2"/>
  <circle cx="20" cy="24" r="4" fill="#FFFFFF" stroke="#FF7A1A" stroke-width="2"/>
  <circle cx="16" cy="50" r="4" fill="#FFFFFF" stroke="#FF7A1A" stroke-width="2"/>

  <!-- 中心函数块 -->
  <rect x="32" y="32" width="16" height="16" rx="3" fill="url(#orbitlink_orange_circle)"/>
  <path d="M37 36 L34 40 L37 44"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M43 36 L46 40 L43 44"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>

